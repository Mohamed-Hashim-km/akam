name: Deploy Akam Digital

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-vps:
    name: Deploy to Hostinger VPS (akam.digital)
    runs-on: [self-hosted, akam-vps]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to Application Directory
        run: |
          echo "📦 Syncing repository code to /var/www/akam-digital..."
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env*' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'frontend/.next' \
            --exclude 'backend/uploads' \
            --exclude 'uploads' \
            ./ /var/www/akam-digital/

      - name: Ensure Directory Structure
        run: |
          echo "📁 Ensuring required upload directories exist..."
          mkdir -p /var/www/akam-digital/backend/uploads/avatars
          mkdir -p /var/www/akam-digital/backend/uploads/books
          mkdir -p /var/www/akam-digital/backend/uploads/covers
          mkdir -p /var/www/akam-digital/backend/uploads/inline-images
          mkdir -p /var/www/akam-digital/backend/uploads/pdfs

      - name: Update Environment Configuration
        run: |
          echo "⚙️ Ensuring Hostinger VPS has current MAIL and PAYU environment variables..."

          upsert_env() {
            local file="$1"
            local key="$2"
            local val="$3"
            if [ -f "$file" ]; then
              if grep -q "^${key}=" "$file"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$file"
              else
                echo "${key}=${val}" >> "$file"
              fi
            fi
          }

          # Update backend environment files
          for ENV_PATH in /var/www/akam-digital/backend/.env /var/www/akam-digital/.env; do
            if [ -f "$ENV_PATH" ]; then
              upsert_env "$ENV_PATH" "MAIL_SERVICE" "accelr_live_sk_4e6cc4aba3c04c337ddbb995632cfaa4c35a718ad77e482807d72d662d19d84c"
              upsert_env "$ENV_PATH" "MAIL_FROM_EMAIL" "no-replay@akamdigital.in"
              upsert_env "$ENV_PATH" "MAIL_FROM_NAME" '"AKAM Digital"'
              upsert_env "$ENV_PATH" "PAYU_ENV" "PRODUCTION"
              upsert_env "$ENV_PATH" "PAYU_MERCHANT_KEY" "RACLzehB"
              upsert_env "$ENV_PATH" "PAYU_SALT" "FDbFV0SnXW"
              upsert_env "$ENV_PATH" "PAYU_PAYMENT_URL" "https://secure.payu.in/_payment"
            fi
          done

          # Update frontend environment files
          for ENV_PATH in /var/www/akam-digital/frontend/.env.production /var/www/akam-digital/frontend/.env.local /var/www/akam-digital/frontend/.env; do
            if [ -f "$ENV_PATH" ]; then
              upsert_env "$ENV_PATH" "NEXT_PUBLIC_PAYU_ENV" "PRODUCTION"
              upsert_env "$ENV_PATH" "PAYU_ENV" "PRODUCTION"
            fi
          done

      - name: Build & Prepare Backend
        run: |
          echo "⚙️ Installing backend dependencies..."
          cd /var/www/akam-digital/backend
          npm ci --prefer-offline || npm install
          echo "🗄️ Emitting Prisma contract & updating database..."
          npm run contract:emit || true
          npm run db:update || true
          echo "🔨 Building NestJS backend..."
          npm run build

      - name: Build Frontend
        run: |
          echo "⚙️ Installing frontend dependencies..."
          cd /var/www/akam-digital/frontend
          npm ci --prefer-offline || npm install
          echo "🧹 Clearing stale Next.js image cache..."
          rm -rf .next/cache/images
          echo "🔨 Building Next.js frontend..."
          npm run build

      - name: Reload PM2 Services
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          echo "🚀 Reloading PM2 services 'akam-digital-api' and 'akam-digital-web'..."
          pm2 reload akam-digital-api --update-env || pm2 restart akam-digital-api --update-env
          pm2 reload akam-digital-web --update-env || pm2 restart akam-digital-web --update-env
          pm2 status
